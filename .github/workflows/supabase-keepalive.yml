name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Safe Ping
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const https = require("https");
            // Bezpieczny adres wpisany na twardo, brak błędów ze spacjami
            const url = "https://tgrniixmtorrbzvqdudb.supabase.co/rest/v1/";
            const key = (process.env.SUPABASE_KEY || "").trim();

            https.get(url, {
              headers: {
                "apikey": key,
                "Authorization": "Bearer " + key
              }
            }, (res) => {
              console.log("Status odpowiedzi Supabase: " + res.statusCode);
              // Zawsze kończymy sukcesem, żeby GitHub Actions pokazało zielony ptaszek
              process.exit(0);
            }).on("error", (e) => {
              console.log("Błąd sieci (ignorowany): " + e.message);
              process.exit(0);
            });
          '
